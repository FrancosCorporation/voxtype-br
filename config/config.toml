# Voxtype Configuration — pt-BR / GPU / ABNT2
# Location: ~/.config/voxtype/config.toml

# State file for external integrations (Waybar, polybar, etc.)
state_file = "auto"

[hotkey]
# Tecla para ditado (com o atalho global do GNOME, o built-in fica desabilitado)
key = "SPACE"
modifiers = ["LEFTCTRL", "LEFTSHIFT"]
mode = "toggle"          # 1ª tecla grava, 2ª para e cola no cursor
enabled = false          # usa atalho do GNOME (sem precisar logout)

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 60

[whisper]
model = "large-v3-turbo" # melhor equilíbrio pt-BR: qualidade do large-v3 com ~2x mais velocidade (1.6 GB)
language = "pt"          # Português do Brasil
translate = false
threads = 8              # ajuda em CPUs sem GPU
gpu_isolation = false    # mantém o modelo na memória — evita recarregar
                         # (~1.6 GB) a cada ditado, o que parecia "demora para renderizar"

[output]
# FILE em vez de type/paste: o daemon só grava a transcrição em arquivo
# (/tmp/voxtype-transcript.txt). Quem digita é o voxtype-toggle (atalho),
# DEPOIS que o estado volta a idle — o OSD já sumiu e o foco voltou à caixa.
# Motivo: o OSD na tela fazia a digitação do daemon ir para o vazio/parcial
# (teclas "comidas") — com o OSD fora do caminho a digitação cai inteira.
mode = "file"
file_path = "/tmp/voxtype-transcript.txt"
file_mode = "overwrite"
paste_keys = "ctrl+v"    # só vale se voltar ao mode = "paste"
fallback_to_clipboard = true
# Ordem de drivers: dotool não está no Ubuntu padrão — usa ydotool + clipboard
driver_order = ["ydotool", "clipboard"]
dotool_xkb_layout = "br"  # ABNT2 (teclado brasileiro)
type_delay_ms = 0
# Espera ANTES de digitar: dá tempo de soltar o Ctrl+Shift do atalho e o foco
# assentar. (O pop-up nativo está desligado — não há roubo de foco esperado.)
pre_type_delay_ms = 800
# Mantém a transcrição no clipboard: se o foco estava na janela errada na hora
# da colagem, é só clicar na caixa certa e dar Ctrl+V manualmente.
restore_clipboard = false
restore_clipboard_delay_ms = 500

[output.notification]
# Pop-up nativo DESLIGADO: o pop-up do GNOME rouba o foco do teclado quando
# aparece (verificado empiricamente) e a digitação vai para o vazio. O feedback
# de transcrição fica no OSD (onda azul "Transcrevendo...") e no texto que
# aparece direto na caixa de texto.
on_recording_start = false
on_recording_stop = false
on_transcription = false
urgency = "normal"

[osd]
# Overlay visual na tela (bin/voxtype-osd): speaker + onda senoidal conforme a
# voz. O daemon inicia o `voxtype-osd` que estiver no PATH. A digitação é feita
# pelo voxtype-toggle DEPOIS que o estado volta a idle (o OSD já escondeu), então
# ele não interfere. enabled = true é o padrão do voxtype.
enabled = true

[ui]
# URL do repositório GitHub (para o menu do ícone na bandeja)
# Deixe vazio para usar o padrão do Voxtype original
repo_url = "https://github.com/FrancosCorporation/FrancosVox"
# Mostrar notificações nativas (libnotify) além do OSD
notify_enabled = true
